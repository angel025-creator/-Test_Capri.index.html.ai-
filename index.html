<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBERDECK // NK-7</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2307040f'/%3E%3Cpath d='M8 18h48v28H8z' fill='none' stroke='%23ff2bd6' stroke-width='3'/%3E%3Cpath d='M16 26l8 6-8 6M28 40h14' fill='none' stroke='%2300f0ff' stroke-width='3'/%3E%3C/svg%3E"><meta name="theme-color" content="#07040f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040f;--panel:#0e0a1c;--line:#2a1f4d;--a:#ff2bd6;--b:#00f0ff;--c:#fcee09;--t:#d8d2f0;--dim:#7d73a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:15px/1.5 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.22;z-index:0}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:8px;max-width:1100px;margin:auto}
header{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);padding:8px 12px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));border-left:3px solid var(--a)}
.logo{font:700 22px 'Rajdhani',sans-serif;letter-spacing:.12em;color:var(--a);text-shadow:0 0 10px var(--a)}
.logo small{color:var(--b);font-size:12px;margin-left:6px;text-shadow:none}
.sp{flex:1}
#clock{color:var(--c)}
.led{width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 8px var(--b);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.3}}
main{position:relative;min-height:0;border:1px solid var(--line);background:rgba(14,10,28,.92);display:flex;flex-direction:column;border-top:2px solid var(--b)}
.mod{display:none;flex:1;min-height:0;flex-direction:column;padding:12px;gap:10px;overflow:auto}
.mod.on{display:flex}
h2{font:700 18px 'Rajdhani',sans-serif;letter-spacing:.1em;color:var(--b);border-bottom:1px dashed var(--line);padding-bottom:4px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:1 0 auto;min-width:74px}
button,input,textarea,select{font:inherit;color:var(--t);background:#0a0716;border:1px solid var(--line);padding:8px 10px;border-radius:0}
button{cursor:pointer;background:var(--panel);font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em}
button:hover,nav button.on{border-color:var(--a);color:var(--a);box-shadow:0 0 10px -2px var(--a)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:1px}
input,textarea{width:100%}
textarea{flex:1;min-height:140px;resize:none}
